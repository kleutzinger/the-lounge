<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>the lounge</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script type="module" src="/static/client.js"></script>
    <script async src="https://cdn.jsdelivr.net/npm/kevbadge/kevbadge.js"></script>
  </head>
  <body>
    <input type="text" id="globalText" placeholder="global message board" />
    <div id="joystickZone"></div>
    <div id="destroy" class="fixedDiv">
      welcome to the lounge. rules: you need a webcam. arrow keys to move. joystick in the bottom left for mobile users.
      click anywhere to start! <br />
      screensharing works best on chrome. tab/system audio sharing support varies by browser and OS.
    </div>

    <button id="skribblLoad">toggle skribbl</button>
    <iframe id="skribbl"></iframe>
    <!--
      the <video> and <audio> tags are all added and removed dynamically
      in socketSetup.js
    -->
  </body>
</html>
